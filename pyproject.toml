[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-watcher"
version = "0.1.0"
description = "Scan a stock universe for price/volume buying-pressure proxies and rank research candidates."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "yfinance>=0.2.54",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
market-watcher = "market_watcher.cli:main"

[tool.setuptools]
packages = ["market_watcher"]

[tool.setuptools.package-data]
market_watcher = ["demo_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
